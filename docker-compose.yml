services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: djr
      POSTGRES_USER: djr
      POSTGRES_PASSWORD: djr-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djr -d djr"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: djr-local-only
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -h postgres -U djr -d djr -v ON_ERROR_STOP=1 -f /migrations/000001_init.sql"]

  api:
    build:
      context: .
      args:
        APP: api
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://djr:djr-local-only@postgres:5432/djr?sslmode=disable
      API_ADDR: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://djr:djr-local-only@postgres:5432/djr?sslmode=disable
      WORKER_ID: local-worker-1
      POLL_INTERVAL: 1s
      LEASE_DURATION: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
