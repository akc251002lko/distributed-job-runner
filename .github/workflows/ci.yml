name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: djr
          POSTGRES_USER: djr
          POSTGRES_PASSWORD: djr-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djr -d djr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://djr:djr-test@localhost:5432/djr?sslmode=disable
      API_DATABASE_URL: postgres://djr_api:local-api-ci@localhost:5432/djr?sslmode=disable
      WORKER_DATABASE_URL: postgres://djr_worker:local-worker-ci@localhost:5432/djr?sslmode=disable
      API_DB_PASSWORD: local-api-ci
      WORKER_DB_PASSWORD: local-worker-ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Verify downloaded modules
        run: go mod verify
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000002_job_cancellation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000003_client_scoping.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/000004_api_rate_limits.sql
      - name: Provision least-privilege application roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v api_password="$API_DB_PASSWORD" -v worker_password="$WORKER_DB_PASSWORD" -f ops/postgres/roles.sql
      - name: Format Go source
        run: gofmt -w ./cmd ./internal
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Verify application role attributes
        run: |
          result=$(psql "$DATABASE_URL" -At -c "SELECT count(*) = 2 AND bool_and(rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT rolinherit) FROM pg_roles WHERE rolname IN ('djr_api','djr_worker')")
          test "$result" = "t"
      - name: Verify API role privileges
        run: |
          result=$(PGPASSWORD="$API_DB_PASSWORD" psql "$API_DATABASE_URL" -At -c "SELECT has_table_privilege(current_user,'jobs','SELECT') AND has_table_privilege(current_user,'jobs','INSERT') AND has_column_privilege(current_user,'jobs','status','UPDATE') AND has_table_privilege(current_user,'api_rate_limits','SELECT') AND has_table_privilege(current_user,'api_rate_limits','INSERT') AND has_table_privilege(current_user,'api_rate_limits','UPDATE') AND NOT has_table_privilege(current_user,'jobs','DELETE') AND NOT has_column_privilege(current_user,'jobs','payload','UPDATE')")
          test "$result" = "t"
      - name: Verify worker role privileges
        run: |
          result=$(PGPASSWORD="$WORKER_DB_PASSWORD" psql "$WORKER_DATABASE_URL" -At -c "SELECT has_table_privilege(current_user,'jobs','SELECT') AND has_column_privilege(current_user,'jobs','lease_token','UPDATE') AND NOT has_table_privilege(current_user,'jobs','INSERT') AND NOT has_table_privilege(current_user,'jobs','DELETE') AND NOT has_table_privilege(current_user,'api_rate_limits','SELECT') AND NOT has_column_privilege(current_user,'jobs','payload','UPDATE')")
          test "$result" = "t"
      - name: Build Go binaries
        run: |
          go build -trimpath ./cmd/api
          go build -trimpath ./cmd/worker
      - name: Build API container
        run: docker build --build-arg APP=api -t djr-api:ci .
      - name: Build worker container
        run: docker build --build-arg APP=worker -t djr-worker:ci .
